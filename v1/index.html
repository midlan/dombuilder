<!DOCTYPE html>
<html>
    <title>dombuilder (v1)</title>
    <script src="dombuilder.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const hash = window.location.hash.substring(1);
            if (!hash) return;
            try {
                const instructions = await decodeInstructions(hash);
                executeInstructions(instructions, document.body);
            } catch (e) {
                console.error('DomBuilder decode error', e);
            }
        });
    </script>
</html>
