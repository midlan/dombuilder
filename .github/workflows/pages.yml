name: Deploy tagged version to GitHub Pages

on:
  push:
    tags: ['*']

permissions:
  contents: write

concurrency:
  group: pages-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v3

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          # Clone existing gh-pages branch, or start a fresh orphan
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            git clone --branch gh-pages --single-branch "$REPO_URL" _site
          else
            mkdir _site && cd _site && git init && git checkout --orphan gh-pages
            git remote add origin "$REPO_URL"
            cd ..
          fi

          # Copy the tagged files into a versioned directory
          mkdir -p "_site/$TAG"
          cp index.html dombuilder.js editor.html "_site/$TAG/"

          # Generate root index listing every deployed version
          cd _site
          {
            echo '<!DOCTYPE html><html><head><title>DomBuilder</title></head><body>'
            echo '<h1>DomBuilder</h1><ul>'
            for d in */; do
              echo "  <li><a href=\"${d}editor.html\">${d%/}</a></li>"
            done
            echo '</ul></body></html>'
          } > index.html

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Deploy $TAG"
          git push origin gh-pages
